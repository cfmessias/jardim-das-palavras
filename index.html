<script>
  const storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
  };
</script>

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}
function normalize(s) {
  return s
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function makeQuizOptions(word, categoryId) {
  const sameCat = ALL_WORDS.filter(
    (w) => w.categoryId === categoryId && w.id !== word.id
  );
  const others = ALL_WORDS.filter(
    (w) => w.categoryId !== categoryId && w.id !== word.id
  );
  const pool = shuffle([...sameCat, ...shuffle(others)]).slice(0, 3);
  return shuffle([word, ...pool]);
}

/* ---------------------------- Avatar ---------------------------- */

  const skin = config.skin;
  const hairColor = config.hairColor;
  const s = size;

  return h("svg", { width: s, height: s, viewBox: "0 0 200 200", "aria-label": "Avatar" },
    bestAccessory?.id === "capa" && h("path", { d: "M 40 120 Q 100 90 160 120 L 175 195 L 25 195 Z", fill: "#F2704E" }),

function StarBadge({ stars, max, size = "normal" }) {

    max ? h("span", { className: "star-max" }, "/", max) : null

}

function ProgressDots({ stage }) {
  const labels = ["Descobre", "Frase", "Escreve"];
  return h("div", { className: "progress-dots", "aria-hidden": true },
    labels.map((l, i) =>
      h("div", { key: l, className: `p-dot ${i < stage ? "done" : ""} ${i === stage ? "active" : ""}` })

}

/* ============================== APP ============================== */

function App() {
  const [loading, setLoading] = useState(true);
  const [screen, setScreen] = useState("setup");
  const [avatar, setAvatar] = useState({
    name: "",
    skin: SKIN_TONES[0],
    hairColor: HAIR_COLORS[0],
    hairStyle: "liso",
  });
  const [progress, setProgress] = useState({});
  const [activeCategory, setActiveCategory] = useState(null);
  const [activeWord, setActiveWord] = useState(null);
  const [toast, setToast] = useState(null);
  const saveTimer = useRef(null);

  const totalStars = ALL_WORDS.reduce((sum, w) => sum + (progress[w.id] || 0), 0);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("jdp-profile");
        if (res && res.value) {
          const data = JSON.parse(res.value);
          if (data.avatar) setAvatar(data.avatar);
          if (data.progress) setProgress(data.progress);
          if (data.setupDone) setScreen("map");
        }
      } catch (e) {
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  function saveProfile(next) {
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await storage.set("jdp-profile", JSON.stringify({ setupDone: true, ...next }));
      } catch (e) {
        console.error("Não foi possível guardar o progresso", e);
      }
    }, 250);
  }

  function finishSetup() {
    const finalName = avatar.name.trim() || "Explorador";
    const next = { ...avatar, name: finalName };
    setAvatar(next);
    setScreen("map");
    saveProfile({ avatar: next, progress });
  }

  function advanceWord(wordId, prevStars) {
    const current = progress[wordId] || 0;
    const nextStage = Math.min(3, current + 1);
    const nextProgress = { ...progress, [wordId]: nextStage };
    setProgress(nextProgress);
    saveProfile({ avatar, progress: nextProgress });

    const newTotal = ALL_WORDS.reduce((sum, w) => sum + (nextProgress[w.id] || 0), 0);
    const crossed = ACCESSORIES.find((a) => prevStars < a.threshold && newTotal >= a.threshold);
    if (crossed) {
      setToast({ type: "unlock", accessory: crossed });
    } else if (nextStage === 3) {
      setToast({ type: "mastered", word: wordId });
    }
    return nextStage;
  }

  function resetGame() {
    setProgress({});
    setAvatar({ name: "", skin: SKIN_TONES[0], hairColor: HAIR_COLORS[0], hairStyle: "liso" });
    setScreen("setup");
    storage.delete("jdp-profile").catch(() => {});
  }

  if (loading) {
    return h("div", { className: "jdp-root" },
      h(Style),
      h("div", { className: "loading-screen" },
        h("div", { className: "loading-seed" }, "🌱"),
        h("p", null, "A preparar o jardim...")
      )
    );
  }

  return h("div", { className: "jdp-root" },
    h(Style),
    screen === "setup" && h(SetupScreen, { avatar, setAvatar, onFinish: finishSetup }),
    screen === "map" && h(MapScreen, {
      avatar, progress, totalStars,
      onOpenCategory: (cat) => { setActiveCategory(cat); setScreen("category"); },
      onReset: resetGame
    }),
    screen === "category" && activeCategory && h(CategoryScreen, {
      category: activeCategory, progress,
      onBack: () => setScreen("map"),
      onOpenWord: (word) => { setActiveWord(word); setScreen("activity"); }
    }),
    screen === "activity" && activeWord && h(ActivityScreen, {
      word: activeWord, category: activeCategory, stage: progress[activeWord.id] || 0,
      totalStars, avatar,
      onExit: () => setScreen("category"),
      onComplete: (prevStars) => advanceWord(activeWord.id, prevStars)
    }),
    toast && h(ToastOverlay, { toast, onClose: () => setToast(null) })
  );
}

/* --------------------------- Setup screen --------------------------- */

          h("div", { className: "swatch-row" },

          h("span", { className: "field-label" }, "Estilo do cabelo"),
          h("div", { className: "pill-row" },
            HAIR_STYLES.map((hStyle) => h("button", {

              onClick: () => setAvatar((a) => ({ ...a, hairStyle: hStyle }))

      h("button", { className: "btn-primary big", onClick: onFinish }, "Começar a aventura")
    )

}

/* ---------------------------- Map screen ---------------------------- */

function MapScreen({ avatar, progress, totalStars, onOpenCategory, onReset }) {
  const [confirmingReset, setConfirmingReset] = useState(false);

  return h("div", { className: "screen map-screen" },
    h("header", { className: "map-header" },
      h("div", { className: "map-header-left" },
        h(Avatar, { config: avatar, stars: totalStars, size: 64 }),
        h("div", null,
          h("div", { className: "hello" }, `Olá, ${avatar.name}!`),
          h(StarBadge, { stars: totalStars, max: MAX_STARS })
        )
      ),
      h("button", { className: "ghost-btn", onClick: () => setConfirmingReset(true) }, "Recomeçar")
    ),
    h("h1", { className: "map-title" }, "O Jardim das Palavras"),
    h("p", { className: "map-sub" }, "Escolhe uma zona para explorar."),
    h("div", { className: "island-grid" },
      CATEGORIES.map((cat) => {
        const mastered = cat.words.filter((w) => (progress[w.id] || 0) === 3).length;
        return h("button", {
          key: cat.id, className: "island-card",
          style: { background: cat.colorSoft, borderColor: cat.color },
          onClick: () => onOpenCategory(cat)
        },
          h("div", { className: "island-icon", style: { background: cat.color } }, h(CategoryIcon, { id: cat.icon })),
          h("div", { className: "island-name", style: { color: cat.colorDark } }, cat.label),
          h("div", { className: "island-progress" }, `${mastered} de ${cat.words.length} dominadas`),
          h("div", { className: "mini-bar" },
            h("div", { className: "mini-bar-fill", style: { width: `${(mastered / cat.words.length) * 100}%`, background: cat.color } })
          )
        );
      })
    ),
    h("div", { className: "accessory-shelf" },
      h("span", { className: "field-label" }, "Coleção"),
      h("div", { className: "accessory-row" },
        ACCESSORIES.map((a) => {
          const unlocked = totalStars >= a.threshold;
          return h("div", { key: a.id, className: `accessory-chip ${unlocked ? "unlocked" : ""}`, title: a.label },
            unlocked ? "★" : a.threshold,
            h("span", { className: "accessory-label" }, a.label)
          );
        })
      )
    ),
    confirmingReset && h("div", { className: "modal-backdrop" },
      h("div", { className: "modal-card" },
        h("h2", null, "Recomeçar o jogo?"),
        h("p", null, "Isto vai apagar o avatar e todas as palavras aprendidas."),
        h("div", { className: "modal-actions" },
          h("button", { className: "ghost-btn", onClick: () => setConfirmingReset(false) }, "Cancelar"),
          h("button", { className: "btn-primary", onClick: onReset }, "Sim, recomeçar")
        )
      )
    )
  );
}

    );
  }
  if (id === "home") {
    return h("svg", { viewBox: "0 0 24 24", width: 26, height: 26, fill: "#fff" },
      h("path", { d: "M12 3 2 11h3v9h6v-6h2v6h6v-9h3z" })
    );
  }
  return h("svg", { viewBox: "0 0 24 24", width: 26, height: 26, fill: "#fff" },
    h("path", { d: "M12 2C7 6 5 10 5 13.5 5 18 8.5 21 12 21s7-3 7-7.5C19 10 17 6 12 2z" })
  );
}

    h("div", { className: "category-banner", style: { background: category.color } },
      h(CategoryIcon, { id: category.icon }),
      h("h1", null, category.label)
    ),
    h("div", { className: "word-grid" },
      category.words.map((w) => {
        const stage = progress[w.id] || 0;
        const mastered = stage === 3;
        return h("button", {
          key: w.id, className: `word-card ${mastered ? "mastered" : ""}`,
          style: { borderColor: category.color },
          onClick: () => onOpenWord(w)
        },
          mastered && h("div", { className: "mastered-ribbon" }, "★ Dominada"),
          h("div", { className: "word-emoji" }, w.emoji),
          h("div", { className: "word-name" }, stage === 0 ? "???" : w.word),
          h(ProgressDots, { stage })
        );
      })
    )
  );
}

/* -------------------------- Activity screen -------------------------- */

function ActivityScreen({ word, category, stage, totalStars, avatar, onExit, onComplete }) {
  if (stage >= 3) return h(MasteredCard, { word, category, avatar, onExit });
  if (stage === 0) return h(QuizStage, { word, category, avatar, onExit, onSuccess: () => onComplete(totalStars) });
  if (stage === 1) return h(SentenceChoiceStage, { word, category, avatar, onExit, onSuccess: () => onComplete(totalStars) });
  return h(WriteStage, { word, category, avatar, onExit, onSuccess: () => onComplete(totalStars) });
}

function ActivityShell({ category, title, stepLabel, onExit, mood, avatar, children }) {
  return h("div", { className: "screen activity-screen", style: { "--cat-color": category.color } },
    h("header", { className: "activity-header" },
      h("button", { className: "ghost-btn", onClick: onExit }, "← Sair"),
      h("span", { className: "step-label", style: { color: category.colorDark } }, stepLabel)
    ),
    h("div", { className: "activity-avatar" }, h(Avatar, { config: avatar, stars: 0, size: 90, mood })),
    h("h1", { className: "activity-title" }, title),
    children
  );
}

function QuizStage({ word, category, avatar, onExit, onSuccess }) {
  const [options] = useState(() => makeQuizOptions(word, category.id));
  const [feedback, setFeedback] = useState(null);
  const [message, setMessage] = useState("De que palavra estamos a falar?");
  const [locked, setLocked] = useState(false);

  function choose(opt) {
    if (locked) return;
    if (opt.id === word.id) {
      setFeedback("right");
      setMessage(pick(PRAISE));
      setLocked(true);
      setTimeout(onSuccess, 900);
    } else {
      setFeedback("wrong");
      setMessage(pick(RETRY));
      setTimeout(() => setFeedback(null), 500);
    }
  }

  return h(ActivityShell, {
    category, title: "Descobre a palavra", stepLabel: "Passo 1 · Descobre", onExit, avatar,
    mood: feedback === "wrong" ? "sad" : feedback === "right" ? "excited" : "happy"
  },
    h("div", { className: "quiz-card" },
      h("div", { className: "quiz-emoji" }, word.emoji),
      h("p", { className: "quiz-hint" }, word.hint)
    ),
    h("p", { className: `feedback-line ${feedback || ""}` }, message),
    h("div", { className: "options-grid" },
      options.map((opt) => h("button", {
        key: opt.id, className: "option-btn", onClick: () => choose(opt), disabled: locked
      }, opt.word))
    )
  );
}

function SentenceChoiceStage({ word, category, avatar, onExit, onSuccess }) {
  const [options] = useState(() => makeQuizOptions(word, category.id));
  const [selected, setSelected] = useState(null);
  const [feedback, setFeedback] = useState(null);
  const [message, setMessage] = useState("Escolhe a palavra certa para completar a frase.");
  const [locked, setLocked] = useState(false);

  function confirm() {
    if (!selected || locked) return;
    if (selected.id === word.id) {
      setFeedback("right");
      setMessage(pick(PRAISE));
      setLocked(true);
      setTimeout(onSuccess, 900);
    } else {
      setFeedback("wrong");
      setMessage(pick(RETRY));
      setTimeout(() => { setFeedback(null); setSelected(null); }, 600);
    }
  }

  return h(ActivityShell, {
    category, title: "Completa a frase", stepLabel: "Passo 2 · Frase", onExit, avatar,
    mood: feedback === "wrong" ? "sad" : feedback === "right" ? "excited" : "happy"
  },
    h("div", { className: "sentence-card" },
      word.blankBefore,
      h("span", { className: `blank-slot ${selected ? "filled" : ""} ${feedback === "wrong" ? "wrong" : ""}` },
        selected ? selected.word : "______"
      ),
      word.blankAfter
    ),
    h("p", { className: `feedback-line ${feedback || ""}` }, message),
    h("div", { className: "chip-row" },
      options.map((opt) => h("button", {
        key: opt.id, className: `chip ${selected?.id === opt.id ? "selected" : ""}`,
        onClick: () => setSelected(opt), disabled: locked
      }, opt.word))
    ),
    h("button", { className: "btn-primary", disabled: !selected || locked, onClick: confirm }, "Confirmar")
  );
}

function WriteStage({ word, category, avatar, onExit, onSuccess }) {
  const [text, setText] = useState("");
  const [feedback, setFeedback] = useState(null);
  const [message, setMessage] = useState(`Escreve uma frase tua com a palavra "${word.word}".`);
  const [locked, setLocked] = useState(false);

  function submit() {
    if (locked) return;
    const clean = text.trim();
    const words = clean.split(/\s+/).filter(Boolean);
    const containsWord = normalize(clean).includes(normalize(word.word));

    if (!clean) {
      setMessage("Escreve a tua frase na caixa antes de enviar.");
      setFeedback("wrong");
      return;
    }
    if (!containsWord) {
      setFeedback("wrong");
      setMessage(`Não encontrei a palavra "${word.word}" na tua frase. Tenta incluir essa palavra.`);
      return;
    }
    if (words.length < 3) {
      setFeedback("wrong");
      setMessage("A tua frase é muito curta. Tenta escrever uma frase completa.");
      return;
    }
    setFeedback("right");
    setMessage(pick(PRAISE) + " Frase guardada no teu caderno.");
    setLocked(true);
    setTimeout(onSuccess, 1100);
  }

  return h(ActivityShell, {
    category, title: "Escreve a tua frase", stepLabel: "Passo 3 · Escreve", onExit, avatar,
    mood: feedback === "wrong" ? "sad" : feedback === "right" ? "excited" : "happy"
  },
    h("div", { className: "write-card" },
      h("div", { className: "write-word" },
        h("span", { className: "write-emoji" }, word.emoji),
        h("span", null, word.word)
      ),
      h("p", { className: "write-hint" }, word.hint),
      h("textarea", {
        className: "write-input", rows: 3,
        placeholder: `Ex.: ontem vi um ${word.word} muito bonito.`,
        value: text, onChange: (e) => setText(e.target.value), disabled: locked
      })
    ),
    h("p", { className: `feedback-line ${feedback || ""}` }, message),
    h("button", { className: "btn-primary", disabled: locked, onClick: submit }, "Enviar frase")
  );
}

function MasteredCard({ word, category, avatar, onExit }) {
  return h(ActivityShell, {
    category, title: "Palavra dominada", stepLabel: "Revisão", onExit, avatar, mood: "excited"
  },
    h("div", { className: "quiz-card" },
      h("div", { className: "quiz-emoji" }, word.emoji),
      h("div", { className: "mastered-word" }, word.word),
      h("p", { className: "quiz-hint" }, word.hint),
      h("p", { className: "example-sentence" },
        `"${word.blankBefore}`,
        h("strong", null, word.word),
        `${word.blankAfter}"`
      )
    ),
    h("button", { className: "btn-primary", onClick: onExit }, "Voltar às palavras")
  );
}

/* ----------------------------- Toast ----------------------------- */

function ToastOverlay({ toast, onClose }) {
  useEffect(() => {
    const t = setTimeout(onClose, 2600);
    return () => clearTimeout(t);
  }, [onClose]);

  return h("div", { className: "toast-backdrop", onClick: onClose },
    h("div", { className: "toast-card" },
      Array.from({ length: 14 }).map((_, i) =>
        h("span", {
          key: i, className: "confetti-bit",
          style: {
            left: `${(i * 37) % 100}%`,
            animationDelay: `${(i % 7) * 0.08}s`,
            background: ["#FFC857", "#F2704E", "#5CAE52", "#6F52B5"][i % 4],
          }
        })
      ),
      toast.type === "unlock"
        ? h(React.Fragment, null,
            h("div", { className: "toast-emoji" }, "🎉"),
            h("h2", null, "Novo acessório!"),
            h("p", null, `Desbloqueaste: ${toast.accessory.label}`)
          )
        : h(React.Fragment, null,
            h("div", { className: "toast-emoji" }, "⭐"),
            h("h2", null, "Palavra dominada!"),
            h("p", null, "Já sabes usar essa palavra em frases.")
          )
    )
  );
}
