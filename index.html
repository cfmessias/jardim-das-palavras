<!-- Pequeno adaptador: guarda o progresso no localStorage do navegador
     (a versão para artefactos do Claude usa window.storage; aqui, fora
     do Claude, usamos localStorage para o mesmo efeito). -->
<script>
  const storage = {
    async get(key) {
      const v = localStorage.getItem(key);
      return v === null ? null : { key, value: v };
    },
    async set(key, value) {
      localStorage.setItem(key, value);
      return { key, value };
    },
    async delete(key) {
      localStorage.removeItem(key);
      return { key, deleted: true };
    },
  };
</script>

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}
function normalize(s) {
  return s
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function makeQuizOptions(word, categoryId) {
  const sameCat = ALL_WORDS.filter(
    (w) => w.categoryId === categoryId && w.id !== word.id
  );
  const others = ALL_WORDS.filter(
    (w) => w.categoryId !== categoryId && w.id !== word.id
  );
  const pool = shuffle([...sameCat, ...shuffle(others)]).slice(0, 3);
  return shuffle([word, ...pool]);
}

function ProgressDots({ stage }) {
  const labels = ["Descobre", "Frase", "Escreve"];
  return (
    <div className="progress-dots" aria-hidden="true">
      {labels.map((l, i) => (
        <div

          className={`p-dot ${i < stage ? "done" : ""} ${

/* ============================== APP ============================== */

function App() {
  const [loading, setLoading] = useState(true);
  const [screen, setScreen] = useState("setup"); // setup | map | category | activity
  const [avatar, setAvatar] = useState({
    name: "",
    skin: SKIN_TONES[0],
    hairColor: HAIR_COLORS[0],
    hairStyle: "liso",
  });
  const [progress, setProgress] = useState({}); // wordId -> 0..3
  const [activeCategory, setActiveCategory] = useState(null);
  const [activeWord, setActiveWord] = useState(null);
  const [toast, setToast] = useState(null); // {type:'unlock', accessory}
  const saveTimer = useRef(null);

  const totalStars = ALL_WORDS.reduce(
    (sum, w) => sum + (progress[w.id] || 0),
    0
  );

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("jdp-profile");
        if (res && res.value) {
          const data = JSON.parse(res.value);
          if (data.avatar) setAvatar(data.avatar);
          if (data.progress) setProgress(data.progress);
          if (data.setupDone) setScreen("map");
        }
      } catch (e) {
        // sem perfil guardado ainda — começa do zero
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  function saveProfile(next) {
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await storage.set(
          "jdp-profile",
          JSON.stringify({ setupDone: true, ...next })
        );
      } catch (e) {
        console.error("Não foi possível guardar o progresso", e);
      }
    }, 250);
  }

  function finishSetup() {
    const finalName = avatar.name.trim() || "Explorador";
    const next = { ...avatar, name: finalName };
    setAvatar(next);
    setScreen("map");
    saveProfile({ avatar: next, progress });
  }

  function advanceWord(wordId, prevStars) {
    const current = progress[wordId] || 0;
    const nextStage = Math.min(3, current + 1);
    const nextProgress = { ...progress, [wordId]: nextStage };
    setProgress(nextProgress);
    saveProfile({ avatar, progress: nextProgress });

    const newTotal = ALL_WORDS.reduce(
      (sum, w) => sum + (nextProgress[w.id] || 0),
      0
    );
    const crossed = ACCESSORIES.find(
      (a) => prevStars < a.threshold && newTotal >= a.threshold
    );
    if (crossed) {
      setToast({ type: "unlock", accessory: crossed });
    } else if (nextStage === 3) {
      setToast({ type: "mastered", word: wordId });
    }
    return nextStage;
  }

  function resetGame() {
    setProgress({});
    setAvatar({
      name: "",
      skin: SKIN_TONES[0],
      hairColor: HAIR_COLORS[0],
      hairStyle: "liso",
    });
    setScreen("setup");
    storage.delete("jdp-profile").catch(() => {});
  }

  if (loading) {
    return (
      <div className="jdp-root">
        <Style />
        <div className="loading-screen">
          <div className="loading-seed">🌱</div>
          <p>A preparar o jardim...</p>
        </div>
      </div>
    );
  }

  return (
    <div className="jdp-root">
      <Style />
      {screen === "setup" && (
        <SetupScreen
          avatar={avatar}
          setAvatar={setAvatar}
          onFinish={finishSetup}
        />
      )}
      {screen === "map" && (
        <MapScreen
          avatar={avatar}
          progress={progress}
          totalStars={totalStars}
          onOpenCategory={(cat) => {
            setActiveCategory(cat);
            setScreen("category");
          }}
          onReset={resetGame}
        />
      )}
      {screen === "category" && activeCategory && (
        <CategoryScreen
          category={activeCategory}
          progress={progress}
          onBack={() => setScreen("map")}
          onOpenWord={(word) => {
            setActiveWord(word);
            setScreen("activity");
          }}
        />
      )}
      {screen === "activity" && activeWord && (
        <ActivityScreen
          word={activeWord}
          category={activeCategory}
          stage={progress[activeWord.id] || 0}
          totalStars={totalStars}
          avatar={avatar}
          onExit={() => setScreen("category")}
          onComplete={(prevStars) => advanceWord(activeWord.id, prevStars)}
        />
      )}
      {toast && (
        <ToastOverlay toast={toast} onClose={() => setToast(null)} />
      )}
    </div>
  );
}

/* ---------------------------- Map screen ---------------------------- */

function MapScreen({ avatar, progress, totalStars, onOpenCategory, onReset }) {
  const [confirmingReset, setConfirmingReset] = useState(false);

  return (
    <div className="screen map-screen">
      <header className="map-header">
        <div className="map-header-left">
          <Avatar config={avatar} stars={totalStars} size={64} />
          <div>
            <div className="hello">Olá, {avatar.name}!</div>
            <StarBadge stars={totalStars} max={MAX_STARS} />
          </div>
        </div>
        <button
          className="ghost-btn"
          onClick={() => setConfirmingReset(true)}
        >
          Recomeçar
        </button>
      </header>

      <h1 className="map-title">O Jardim das Palavras</h1>
      <p className="map-sub">Escolhe uma zona para explorar.</p>

      <div className="island-grid">
        {CATEGORIES.map((cat) => {
          const mastered = cat.words.filter(
            (w) => (progress[w.id] || 0) === 3
          ).length;
          return (
            <button
              key={cat.id}
              className="island-card"
              style={{
                background: cat.colorSoft,
                borderColor: cat.color,
              }}
              onClick={() => onOpenCategory(cat)}
            >
              <div
                className="island-icon"
                style={{ background: cat.color }}
              >
                <CategoryIcon id={cat.icon} />
              </div>
              <div className="island-name" style={{ color: cat.colorDark }}>
                {cat.label}
              </div>
              <div className="island-progress">
                {mastered} de {cat.words.length} dominadas
              </div>
              <div className="mini-bar">
                <div
                  className="mini-bar-fill"
                  style={{
                    width: `${(mastered / cat.words.length) * 100}%`,
                    background: cat.color,
                  }}
                />
              </div>
            </button>
          );
        })}
      </div>

      <div className="accessory-shelf">
        <span className="field-label">Coleção</span>
        <div className="accessory-row">
          {ACCESSORIES.map((a) => {
            const unlocked = totalStars >= a.threshold;
            return (
              <div
                key={a.id}
                className={`accessory-chip ${unlocked ? "unlocked" : ""}`}
                title={a.label}
              >
                {unlocked ? "★" : a.threshold}
                <span className="accessory-label">{a.label}</span>
              </div>
            );
          })}
        </div>
      </div>

      {confirmingReset && (
        <div className="modal-backdrop">
          <div className="modal-card">
            <h2>Recomeçar o jogo?</h2>
            <p>Isto vai apagar o avatar e todas as palavras aprendidas.</p>
            <div className="modal-actions">
              <button
                className="ghost-btn"
                onClick={() => setConfirmingReset(false)}
              >
                Cancelar
              </button>
              <button className="btn-primary" onClick={onReset}>
                Sim, recomeçar
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* -------------------------- Category screen -------------------------- */

function CategoryScreen({ category, progress, onBack, onOpenWord }) {
  return (
    <div className="screen category-screen">
      <header className="category-header">
        <button className="ghost-btn" onClick={onBack}>
          ← Voltar ao mapa
        </button>

        className="category-banner"
        style={{ background: category.color }}
      >

      </div>

      <div className="word-grid">
        {category.words.map((w) => {
          const stage = progress[w.id] || 0;
          const mastered = stage === 3;
          return (
            <button
              key={w.id}
              className={`word-card ${mastered ? "mastered" : ""}`}

/* -------------------------- Activity screen -------------------------- */

function ActivityScreen({
  word,
  category,
  stage,
  totalStars,
  avatar,
  onExit,
  onComplete,
}) {
  if (stage >= 3) {
    return (
      <MasteredCard
        word={word}
        category={category}
        avatar={avatar}
        onExit={onExit}
      />
    );
  }
  if (stage === 0) {
    return (
      <QuizStage
        word={word}
        category={category}
        avatar={avatar}
        onExit={onExit}
        onSuccess={() => onComplete(totalStars)}
      />
    );
  }
  if (stage === 1) {
    return (
      <SentenceChoiceStage
        word={word}
        category={category}
        avatar={avatar}
        onExit={onExit}
        onSuccess={() => onComplete(totalStars)}
      />
    );
  }
  return (
    <WriteStage
      word={word}
      category={category}
      avatar={avatar}
      onExit={onExit}
      onSuccess={() => onComplete(totalStars)}
    />
  );
}

function ActivityShell({ category, title, stepLabel, onExit, mood, avatar, children }) {
  return (
    <div className="screen activity-screen" style={{ "--cat-color": category.color }}>
      <header className="activity-header">
        <button className="ghost-btn" onClick={onExit}>
          ← Sair
        </button>
        <span className="step-label" style={{ color: category.colorDark }}>
          {stepLabel}
        </span>
      </header>
      <div className="activity-avatar">
        <Avatar config={avatar} stars={0} size={90} mood={mood} />
      </div>
      <h1 className="activity-title">{title}</h1>
      {children}
    </div>
  );
}

function QuizStage({ word, category, avatar, onExit, onSuccess }) {
  const [options] = useState(() => makeQuizOptions(word, category.id));
  const [feedback, setFeedback] = useState(null); // 'right' | 'wrong'
  const [message, setMessage] = useState(
    "De que palavra estamos a falar?"
  );
  const [locked, setLocked] = useState(false);

  function choose(opt) {
    if (locked) return;
    if (opt.id === word.id) {
      setFeedback("right");
      setMessage(pick(PRAISE));
      setLocked(true);
      setTimeout(onSuccess, 900);
    } else {
      setFeedback("wrong");
      setMessage(pick(RETRY));
      setTimeout(() => setFeedback(null), 500);
    }
  }

  return (
    <ActivityShell
      category={category}
      title="Descobre a palavra"
      stepLabel="Passo 1 · Descobre"
      onExit={onExit}
      avatar={avatar}
      mood={feedback === "wrong" ? "sad" : feedback === "right" ? "excited" : "happy"}
    >
      <div className="quiz-card">
        <div className="quiz-emoji">{word.emoji}</div>
        <p className="quiz-hint">{word.hint}</p>
      </div>
      <p className={`feedback-line ${feedback || ""}`}>{message}</p>
      <div className="options-grid">
        {options.map((opt) => (
          <button
            key={opt.id}
            className="option-btn"
            onClick={() => choose(opt)}
            disabled={locked}
          >
            {opt.word}
          </button>
        ))}
      </div>
    </ActivityShell>
  );
}

function SentenceChoiceStage({ word, category, avatar, onExit, onSuccess }) {
  const [options] = useState(() => makeQuizOptions(word, category.id));
  const [selected, setSelected] = useState(null);
  const [feedback, setFeedback] = useState(null);
  const [message, setMessage] = useState(
    "Escolhe a palavra certa para completar a frase."
  );
  const [locked, setLocked] = useState(false);

  function confirm() {
    if (!selected || locked) return;
    if (selected.id === word.id) {
      setFeedback("right");
      setMessage(pick(PRAISE));
      setLocked(true);
      setTimeout(onSuccess, 900);
    } else {
      setFeedback("wrong");
      setMessage(pick(RETRY));
      setTimeout(() => {
        setFeedback(null);
        setSelected(null);
      }, 600);
    }
  }

  return (
    <ActivityShell
      category={category}
      title="Completa a frase"
      stepLabel="Passo 2 · Frase"
      onExit={onExit}
      avatar={avatar}
      mood={feedback === "wrong" ? "sad" : feedback === "right" ? "excited" : "happy"}
    >
      <div className="sentence-card">
        {word.blankBefore}
        <span
          className={`blank-slot ${selected ? "filled" : ""} ${
            feedback === "wrong" ? "wrong" : ""
          }`}
        >
          {selected ? selected.word : "______"}
        </span>
        {word.blankAfter}
      </div>
      <p className={`feedback-line ${feedback || ""}`}>{message}</p>
      <div className="chip-row">
        {options.map((opt) => (
          <button
            key={opt.id}
            className={`chip ${selected?.id === opt.id ? "selected" : ""}`}
            onClick={() => setSelected(opt)}
            disabled={locked}
          >
            {opt.word}
          </button>
        ))}
      </div>
      <button
        className="btn-primary"
        disabled={!selected || locked}
        onClick={confirm}
      >
        Confirmar
      </button>
    </ActivityShell>
  );
}

function WriteStage({ word, category, avatar, onExit, onSuccess }) {
  const [text, setText] = useState("");
  const [feedback, setFeedback] = useState(null);
  const [message, setMessage] = useState(
    `Escreve uma frase tua com a palavra "${word.word}".`
  );
  const [locked, setLocked] = useState(false);

  function submit() {
    if (locked) return;
    const clean = text.trim();
    const words = clean.split(/\s+/).filter(Boolean);
    const containsWord = normalize(clean).includes(normalize(word.word));

    if (!clean) {
      setMessage("Escreve a tua frase na caixa antes de enviar.");
      setFeedback("wrong");
      return;
    }
    if (!containsWord) {
      setFeedback("wrong");
      setMessage(`Não encontrei a palavra "${word.word}" na tua frase. Tenta incluir essa palavra.`);
      return;
    }
    if (words.length < 3) {
      setFeedback("wrong");
      setMessage("A tua frase é muito curta. Tenta escrever uma frase completa.");
      return;
    }
    setFeedback("right");
    setMessage(pick(PRAISE) + " Frase guardada no teu caderno.");
    setLocked(true);
    setTimeout(onSuccess, 1100);
  }

  return (
    <ActivityShell
      category={category}
      title="Escreve a tua frase"
      stepLabel="Passo 3 · Escreve"
      onExit={onExit}
      avatar={avatar}
      mood={feedback === "wrong" ? "sad" : feedback === "right" ? "excited" : "happy"}
    >
      <div className="write-card">
        <div className="write-word">
          <span className="write-emoji">{word.emoji}</span>
          <span>{word.word}</span>
        </div>
        <p className="write-hint">{word.hint}</p>
        <textarea
          className="write-input"
          rows={3}
          placeholder={`Ex.: ontem vi um ${word.word} muito bonito.`}
          value={text}
          onChange={(e) => setText(e.target.value)}
          disabled={locked}
        />
      </div>
      <p className={`feedback-line ${feedback || ""}`}>{message}</p>
      <button className="btn-primary" disabled={locked} onClick={submit}>
        Enviar frase
      </button>
    </ActivityShell>
  );
}

function MasteredCard({ word, category, avatar, onExit }) {
  return (
    <ActivityShell
      category={category}
      title="Palavra dominada"
      stepLabel="Revisão"
      onExit={onExit}
      avatar={avatar}
      mood="excited"
    >
      <div className="quiz-card">
        <div className="quiz-emoji">{word.emoji}</div>
        <div className="mastered-word">{word.word}</div>
        <p className="quiz-hint">{word.hint}</p>
        <p className="example-sentence">
          "{word.blankBefore}
          <strong>{word.word}</strong>
          {word.blankAfter}"
        </p>
      </div>
      <button className="btn-primary" onClick={onExit}>
        Voltar às palavras
      </button>
    </ActivityShell>
  );
}

/* ----------------------------- Toast ----------------------------- */

function ToastOverlay({ toast, onClose }) {
  useEffect(() => {
    const t = setTimeout(onClose, 2600);
    return () => clearTimeout(t);
  }, [onClose]);

  return (
    <div className="toast-backdrop" onClick={onClose}>
      <div className="toast-card">
        {Array.from({ length: 14 }).map((_, i) => (
          <span
            key={i}
            className="confetti-bit"
            style={{
              left: `${(i * 37) % 100}%`,
              animationDelay: `${(i % 7) * 0.08}s`,
              background: ["#FFC857", "#F2704E", "#5CAE52", "#6F52B5"][i % 4],
            }}
          />
        ))}
        {toast.type === "unlock" ? (
          <>
            <div className="toast-emoji">🎉</div>
            <h2>Novo acessório!</h2>
            <p>Desbloqueaste: {toast.accessory.label}</p>
          </>
        ) : (
          <>
            <div className="toast-emoji">⭐</div>
            <h2>Palavra dominada!</h2>
            <p>Já sabes usar essa palavra em frases.</p>
          </>
        )}
      </div>
    </div>
  );
}
