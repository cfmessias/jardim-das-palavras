<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />

<title>O Jardim das Palavras - Escolas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌻</text></svg>" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  html, body { margin:0; padding:0; background:#EAF7FF; min-height:100vh; }
  #root { max-width: 760px; margin: 0 auto; min-height: 100vh; }

<body>
<div id="root"></div>

<script type="text/javascript">
const { useState, useEffect, useRef, createElement: h } = React;

/* =========================================================================

   ========================================================================= */

const WORDS_BY_GRADE = {
  1: [
    { id: "g1_gato", word: "gato", emoji: "🐱", hint: "Animal doméstico que faz miau.", blankBefore: "O ", blankAfter: " bebeu o leite da tigela." },
    { id: "g1_sol", word: "sol", emoji: "☀️", hint: "Brilha no céu e dá luz e calor.", blankBefore: "Hoje o ", blankAfter: " está muito forte." },
    { id: "g1_bola", word: "bola", emoji: "⚽", hint: "Objeto redondo usado para jogar futebol.", blankBefore: "Ele deu um pontapé na ", blankAfter: "." },
    { id: "g1_casa", word: "casa", emoji: "🏠", hint: "Lugar onde vivemos com a família.", blankBefore: "A minha ", blankAfter: " tem um jardim bonito." }
  ],
  2: [
    { id: "g2_arvore", word: "árvore", emoji: "🌳", hint: "Planta grande com tronco, ramos e folhas.", blankBefore: "O passarinho fez o ninho na ", blankAfter: "." },
    { id: "g2_janela", word: "janela", emoji: "🪟", hint: "Abertura na parede para entrar luz e ar.", blankBefore: "Abri a ", blankAfter: " para ver a chuva a cair." },
    { id: "g2_estrela", word: "estrela", emoji: "⭐", hint: "Ponto brilhante que vemos no céu à noite.", blankBefore: "A ", blankAfter: " mais brilhante guiava os marinheiros." },
    { id: "g2_mochila", word: "mochila", emoji: "🎒", hint: "Saco que levamos nas costas para a escola.", blankBefore: "Guardei os cadernos na minha ", blankAfter: "." }
  ],
  3: [
    { id: "g3_borboleta", word: "borboleta", emoji: "🦋", hint: "Inseto com asas coloridas que voa entre as flores.", blankBefore: "Uma ", blankAfter: " voou por cima das rosas." },
    { id: "g3_tempestade", word: "tempestade", emoji: "⛈️", hint: "Chuva forte acompanhada de vento e trovões.", blankBefore: "A ", blankAfter: " fez muito barulho durante a noite." },
    { id: "g3_biblioteca", word: "biblioteca", emoji: "📚", hint: "Lugar com muitos livros para ler e estudar.", blankBefore: "Fomos à ", blankAfter: " requisitar um livro de aventuras." },
    { id: "g3_bussola", word: "bússola", emoji: "🧭", hint: "Instrumento com agulha magnética que indica o Norte.", blankBefore: "O explorador usou a ", blankAfter: " para não se perder." }
  ],
  4: [
    { id: "g4_arquipelago", word: "arquipélago", emoji: "🏝️", hint: "Conjunto de várias ilhas reunidas no mar.", blankBefore: "Os Açores são um ", blankAfter: " português no Atlântico." },
    { id: "g4_telescopio", word: "telescópio", emoji: "🔭", hint: "Instrumento ótico para observar os astros distantes.", blankBefore: "Olhámos para a Lua através do ", blankAfter: "." },
    { id: "g4_metamorfose", word: "metamorfose", emoji: "🐛", hint: "Transformação que alguns animais sofrem no seu desenvolvimento.", blankBefore: "A lagarta passa por uma ", blankAfter: " até virar borboleta." },
    { id: "g4_ecossistema", word: "ecossistema", emoji: "🌍", hint: "Conjunto formado pelos seres vivos e o seu meio ambiente.", blankBefore: "É fundamental proteger o ", blankAfter: " da floresta." }
  ],
  5: [
    { id: "g5_biodiversidade", word: "biodiversidade", emoji: "🌿", hint: "Variedade de espécies de seres vivos num determinado habitat.", blankBefore: "A poluição ameaça a ", blankAfter: " dos oceanos." },
    { id: "g5_civilizacao", word: "civilização", emoji: "🏛️", hint: "Conjunto de aspetos culturais, científicos e sociais de um povo.", blankBefore: "A ", blankAfter: " grega deixou-nos um grande legado." },
    { id: "g5_hipotese", word: "hipótese", emoji: "💡", hint: "Suposição que se faz para tentar explicar um fenómeno.", blankBefore: "O cientista formulou uma ", blankAfter: " para a sua experiência." },
    { id: "g5_atmosfera", word: "atmosfera", emoji: "🌌", hint: "Camada de gases que envolve e protege a Terra.", blankBefore: "A ", blankAfter: " protege o nosso planeta dos raios nocivos." }
  ],
  6: [
    { id: "g6_persistência", word: "persistência", emoji: "🧗", hint: "Qualidade de quem não desiste perante as dificuldades.", blankBefore: "Com muita ", blankAfter: ", ele conseguiu superar o desafio." },
    { id: "g6_soberania", word: "soberania", emoji: "👑", hint: "Poder supremo e independente de um Estado.", blankBefore: "A constituição garante a ", blankAfter: " do povo." },
    { id: "g6_sustentabilidade", word: "sustentabilidade", emoji: "🌱", hint: "Uso consciente dos recursos sem comprometer o futuro.", blankBefore: "A ", blankAfter: " é essencial para combater as alterações climáticas." },
    { id: "g6_imparcialidade", word: "imparcialidade", emoji: "⚖️", hint: "Capacidade de julgar sem tomar partes ou emitir favoritismos.", blankBefore: "O juiz manteve total ", blankAfter: " durante o julgamento." }
  ]
};

const INITIAL_CLASS_DATA = {
  teacherPin: "1234",
  students: [
    { id: "st_1", name: "Ana Silva", pin: "1111", grade: 2, avatar: { skin: "#FFDBB4", hairColor: "#D4A017", hairStyle: "liso" }, progress: {} },
    { id: "st_2", name: "Diogo Costa", pin: "2222", grade: 4, avatar: { skin: "#C68642", hairColor: "#2E2321", hairStyle: "encaracolado" }, progress: {} }
  ]
};

function normalize(s) {
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

/* =========================================================================
   COMPONENTE PRINCIPAL
   ========================================================================= */

function App() {
  const [classData, setClassData] = useState(INITIAL_CLASS_DATA);
  const [screen, setScreen] = useState("login"); // login | teacher_pin | teacher_dash | student_pin | game
  const [selectedStudentId, setSelectedStudentId] = useState("");
  const [currentStudent, setCurrentStudent] = useState(null);
  const [activeWord, setActiveWord] = useState(null);

  useEffect(() => {
    const saved = localStorage.getItem("jdp_class_data");
    if (saved) {
      try { setClassData(JSON.parse(saved)); } catch(e) {}
    }
  }, []);

  function saveClassData(newData) {
    setClassData(newData);
    localStorage.setItem("jdp_class_data", JSON.stringify(newData));
  }

  function handleUpdateStudentProgress(studentId, wordId, newStage) {
    const updatedStudents = classData.students.map(st => {
      if (st.id === studentId) {
        const nextProgress = { ...st.progress, [wordId]: newStage };
        const updated = { ...st, progress: nextProgress };
        if (currentStudent && currentStudent.id === studentId) {
          setCurrentStudent(updated);
        }
        return updated;
      }
      return st;
    });
    saveClassData({ ...classData, students: updatedStudents });
  }

  return h("div", { className: "jdp-root" },
    h(Style),
    screen === "login" && h(LoginScreen, {
      students: classData.students,
      onSelectStudent: (id) => { setSelectedStudentId(id); setScreen("student_pin"); },
      onOpenTeacher: () => setScreen("teacher_pin")
    }),
    screen === "student_pin" && h(StudentPinScreen, {
      student: classData.students.find(s => s.id === selectedStudentId),
      onBack: () => setScreen("login"),
      onSuccess: (st) => { setCurrentStudent(st); setScreen("game"); }
    }),
    screen === "teacher_pin" && h(TeacherPinScreen, {
      correctPin: classData.teacherPin,
      onBack: () => setScreen("login"),
      onSuccess: () => setScreen("teacher_dash")
    }),
    screen === "teacher_dash" && h(TeacherDashboard, {
      classData,
      onSaveData: saveClassData,
      onExit: () => setScreen("login")
    }),
    screen === "game" && currentStudent && h(StudentGame, {
      student: currentStudent,
      onProgress: (wordId, stage) => handleUpdateStudentProgress(currentStudent.id, wordId, stage),
      onLogout: () => { setCurrentStudent(null); setScreen("login"); }
    })
  );
}

/* =========================================================================
   ECRÃS DE LOGIN E PIN
   ========================================================================= */

function LoginScreen({ students, onSelectStudent, onOpenTeacher }) {
  return h("div", { className: "screen login-screen" },
    h("div", { className: "header-tag" }, "🌻 O Jardim das Palavras · Escolas"),
    h("h1", null, "Quem vai jogar agora?"),
    h("p", { className: "sub" }, "Escolhe o teu nome da lista para entrares na tua aventura."),
    h("div", { className: "student-grid" },
      students.map(s => h("button", {
        key: s.id, className: "student-card",
        onClick: () => onSelectStudent(s.id)
      },
        h("div", { className: "avatar-circle" }, s.name.charAt(0)),
        h("div", { className: "st-info" },
          h("div", { className: "st-name" }, s.name),
          h("div", { className: "st-grade" }, `${s.grade}.º Ano de Escolaridade`)
        )
      ))
    ),
    h("button", { className: "teacher-link", onClick: onOpenTeacher }, "🔑 Área do Professor")
  );
}

function StudentPinScreen({ student, onBack, onSuccess }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);

  if (!student) return null;

  function handleSubmit(e) {
    e.preventDefault();
    if (pin === student.pin) {
      onSuccess(student);
    } else {
      setError(true);
      setPin("");
    }
  }

  return h("div", { className: "screen center-screen" },
    h("div", { className: "card-box" },
      h("button", { className: "ghost-btn", onClick: onBack }, "← Voltar"),
      h("h2", null, `Olá, ${student.name}!`),
      h("p", { className: "sub" }, "Introduz o teu PIN de 4 dígitos dado pelo professor."),
      h("form", { onSubmit: handleSubmit },
        h("input", {
          type: "password", maxLength: 4, className: "pin-input", autoFocus: true,
          value: pin, onChange: (e) => { setError(false); setPin(e.target.value); }
        }),
        error && h("p", { className: "err-msg" }, "PIN incorreto. Tenta novamente."),
        h("button", { type: "submit", className: "btn-primary big", disabled: pin.length < 4 }, "Entrar no Jogo")
      )
    )
  );
}

function TeacherPinScreen({ correctPin, onBack, onSuccess }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState(false);

  function handleSubmit(e) {
    e.preventDefault();
    if (pin === correctPin) {
      onSuccess();
    } else {
      setError(true);
      setPin("");
    }
  }

  return h("div", { className: "screen center-screen" },
    h("div", { className: "card-box" },
      h("button", { className: "ghost-btn", onClick: onBack }, "← Voltar"),
      h("h2", null, "Acesso do Docente"),
      h("p", { className: "sub" }, "Insira o PIN de administração (Predefinido: 1234)."),
      h("form", { onSubmit: handleSubmit },
        h("input", {
          type: "password", maxLength: 6, className: "pin-input", autoFocus: true,
          value: pin, onChange: (e) => { setError(false); setPin(e.target.value); }
        }),
        error && h("p", { className: "err-msg" }, "PIN incorreto."),
        h("button", { type: "submit", className: "btn-primary big" }, "Autenticar")
      )
    )
  );
}

/* =========================================================================
   PAINEL DO PROFESSOR (GESTAO DE ALUNOS E TURMA)
   ========================================================================= */

function TeacherDashboard({ classData, onSaveData, onExit }) {
  const [newName, setNewName] = useState("");
  const [newPin, setNewPin] = useState("");
  const [newGrade, setNewGrade] = useState(1);
  const [teacherPinInput, setTeacherPinInput] = useState(classData.teacherPin);

  function handleAddStudent(e) {
    e.preventDefault();
    if (!newName.trim() || !newPin.trim()) return;
    const newSt = {
      id: "st_" + Date.now(),
      name: newName.trim(),
      pin: newPin.trim(),
      grade: parseInt(newGrade, 10),
      avatar: { skin: "#FFDBB4", hairColor: "#2E2321", hairStyle: "liso" },
      progress: {}
    };
    onSaveData({ ...classData, students: [...classData.students, newSt] });
    setNewName("");
    setNewPin("");
  }

  function handleDeleteStudent(id) {
    if (confirm("Tem a certeza que deseja remover este aluno?")) {
      const updated = classData.students.filter(s => s.id !== id);
      onSaveData({ ...classData, students: updated });
    }
  }

  function handleUpdateTeacherPin() {
    if (teacherPinInput.trim().length >= 4) {
      onSaveData({ ...classData, teacherPin: teacherPinInput.trim() });
      alert("PIN do professor atualizado com sucesso!");
    }
  }

  function handleExportJSON() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(classData, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "turma_jardim_palavras.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function handleImportJSON(e) {
    const fileReader = new FileReader();
    if (e.target.files[0]) {
      fileReader.readAsText(e.target.files[0], "UTF-8");
      fileReader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (parsed.students && parsed.teacherPin) {
            onSaveData(parsed);
            alert("Dados da turma importados com sucesso!");
          }
        } catch(err) {
          alert("Ficheiro JSON inválido.");
        }
      };
    }
  }

  return h("div", { className: "screen dashboard-screen" },
    h("header", { className: "dash-header" },
      h("h1", null, "Painel do Professor"),
      h("button", { className: "ghost-btn", onClick: onExit }, "Sair")
    ),
    h("div", { className: "dash-grid" },
      h("div", { className: "dash-card" },
        h("h3", null, "Adicionar Aluno"),
        h("form", { onSubmit: handleAddStudent, className: "form-stack" },
          h("input", {
            className: "text-input", placeholder: "Nome do Aluno",
            value: newName, onChange: (e) => setNewName(e.target.value)
          }),
          h("div", { className: "row-input" },
            h("input", {
              className: "text-input", placeholder: "PIN (4 dígitos)", maxLength: 4,
              value: newPin, onChange: (e) => setNewPin(e.target.value)
            }),
            h("select", {
              className: "text-input", value: newGrade,
              onChange: (e) => setNewGrade(e.target.value)
            },
              [1,2,3,4,5,6].map(g => h("option", { key: g, value: g }, `${g}.º Ano`))
            )
          ),
          h("button", { type: "submit", className: "btn-primary" }, "Criar Aluno")
        )
      ),
      h("div", { className: "dash-card" },
        h("h3", null, "Definições da Conta"),
        h("div", { className: "form-stack" },
          h("label", { className: "field-label" }, "Alterar PIN do Professor"),
          h("div", { className: "row-input" },
            h("input", {
              className: "text-input", value: teacherPinInput,
              onChange: (e) => setTeacherPinInput(e.target.value)
            }),
            h("button", { className: "btn-primary", onClick: handleUpdateTeacherPin }, "Guardar")
          ),
          h("hr", null),
          h("div", { className: "row-input" },
            h("button", { className: "ghost-btn", onClick: handleExportJSON }, "💾 Exportar Turma (JSON)"),
            h("label", { className: "ghost-btn upload-btn" },
              "📁 Importar JSON",
              h("input", { type: "file", accept: ".json", onChange: handleImportJSON, style: { display: "none" } })
            )
          )
        )
      )
    ),
    h("h2", { style: { marginTop: "24px" } }, "Lista de Alunos"),
    h("div", { className: "table-card" },
      h("table", { className: "dash-table" },
        h("thead", null,
          h("tr", null,
            h("th", null, "Nome"),
            h("th", null, "Ano"),
            h("th", null, "PIN"),
            h("th", null, "Progresso"),
            h("th", null, "Ações")
          )
        ),
        h("tbody", null,
          classData.students.map(st => {
            const gradeWords = WORDS_BY_GRADE[st.grade] || [];
            const completed = gradeWords.filter(w => (st.progress[w.id] || 0) === 3).length;
            return h("tr", { key: st.id },
              h("td", { className: "td-bold" }, st.name),
              h("td", null, `${st.grade}.º Ano`),
              h("td", null, h("code", null, st.pin)),
              h("td", null, `${completed} / ${gradeWords.length} palavras dominadas`),
              h("td", null,
                h("button", { className: "danger-btn", onClick: () => handleDeleteStudent(st.id) }, "Remover")
              )
            );
          })
        )
      )
    )
  );
}

/* =========================================================================
   MÓDULO DO JOGO (ALUNO)
   ========================================================================= */

function StudentGame({ student, onProgress, onLogout }) {
  const [activeWord, setActiveWord] = useState(null);
  const words = WORDS_BY_GRADE[student.grade] || WORDS_BY_GRADE[1];

  return h("div", { className: "screen game-screen" },
    h("header", { className: "game-header" },
      h("div", null,
        h("h2", null, `Olá, ${student.name}!`),
        h("span", { className: "grade-badge" }, `${student.grade}.º Ano de Escolaridade`)
      ),
      h("button", { className: "ghost-btn", onClick: onLogout }, "Sair")
    ),
    !activeWord ? h("div", null,
      h("h1", { className: "map-title" }, "Palavras para Aprender"),
      h("p", { className: "sub" }, "Escolhe uma palavra para completar os 3 passos."),
      h("div", { className: "word-grid" },
        words.map(w => {
          const stage = student.progress[w.id] || 0;
          return h("button", {
            key: w.id, className: `word-card ${stage === 3 ? "mastered" : ""}`,
            onClick: () => setActiveWord(w)
          },
            stage === 3 && h("div", { className: "mastered-ribbon" }, "★ Dominada"),
            h("div", { className: "word-emoji" }, w.emoji),
            h("div", { className: "word-name" }, w.word),
            h("div", { className: "stage-label" }, `Passo ${Math.min(stage + 1, 3)} de 3`)
          );
        })
      )
    ) : h(WordActivity, {
      word: activeWord,
      currentStage: student.progress[activeWord.id] || 0,
      onBack: () => setActiveWord(null),
      onAdvance: () => {
        const next = Math.min(3, (student.progress[activeWord.id] || 0) + 1);
        onProgress(activeWord.id, next);
        if (next === 3) setActiveWord(null);
      }
    })
  );
}

function WordActivity({ word, currentStage, onBack, onAdvance }) {
  const [userText, setUserText] = useState("");
  const [feedback, setFeedback] = useState(null);

  function handleStage1() {
    setFeedback("right");
    setTimeout(() => { setFeedback(null); onAdvance(); }, 800);
  }

  function handleStage2() {
    setFeedback("right");
    setTimeout(() => { setFeedback(null); onAdvance(); }, 800);
  }

  function handleStage3() {
    const clean = normalize(userText);
    if (clean.includes(normalize(word.word)) && userText.trim().split(/\s+/).length >= 3) {
      setFeedback("right");
      setTimeout(() => { setFeedback(null); onAdvance(); }, 1000);
    } else {
      setFeedback("wrong");
    }
  }

  return h("div", { className: "activity-box" },
    h("button", { className: "ghost-btn", onClick: onBack }, "← Voltar às palavras"),
    h("div", { className: "quiz-card" },
      h("div", { className: "quiz-emoji" }, word.emoji),
      h("h2", null, word.word),
      h("p", { className: "quiz-hint" }, word.hint)
    ),
    currentStage === 0 && h("div", { className: "action-area" },
      h("h3", null, "Passo 1: Reconhece a palavra"),
      h("button", { className: "btn-primary big", onClick: handleStage1 }, `Confirmar palavra "${word.word}"`)
    ),
    currentStage === 1 && h("div", { className: "action-area" },
      h("h3", null, "Passo 2: Completa a frase"),
      h("p", { className: "sentence-card" }, word.blankBefore, h("u", null, word.word), word.blankAfter),
      h("button", { className: "btn-primary big", onClick: handleStage2 }, "Compreendi o contexto")
    ),
    currentStage === 2 && h("div", { className: "action-area" },
      h("h3", null, `Passo 3: Escreve uma frase tua com "${word.word}"`),
      h("textarea", {
        className: "write-input", rows: 3, placeholder: "Escreve a tua frase aqui...",
        value: userText, onChange: (e) => setUserText(e.target.value)
      }),
      feedback === "wrong" && h("p", { className: "err-msg" }, `A frase deve conter a palavra "${word.word}" e ter pelo menos 3 palavras.`),
      h("button", { className: "btn-primary big", onClick: handleStage3 }, "Validar Frase")
    ),
    feedback === "right" && h("p", { className: "success-msg" }, "Excelente! Passo concluído com sucesso! 🎉")
  );
}

/* =========================================================================
   ESTILOS CSS
   ========================================================================= */

function Style() {
  return h("style", null, `
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap');

    .jdp-root {
      --sky-light: #EAF7FF;
      --paper: #FFFDF7;
      --ink: #2E2A26;
      --ink-soft: #6b6459;
      --coral: #F2704E;
      --green: #5CAE52;
      font-family: 'Quicksand', sans-serif;
      color: var(--ink);
      min-height: 100vh;
      background: var(--paper);
    }
    .jdp-root * { box-sizing: border-box; }
    .screen { padding: 24px; max-width: 720px; margin: 0 auto; }
    .center-screen { display:flex; justify-content:center; align-items:center; min-height: 80vh; }
    
    h1, h2, h3 { font-family: 'Baloo 2', sans-serif; margin: 0 0 8px; }
    .sub { color: var(--ink-soft); margin-bottom: 20px; line-height: 1.4; }
    .header-tag { font-size: 13px; font-weight: 700; color: var(--coral); text-transform: uppercase; margin-bottom: 8px; }

    .student-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .student-card {
      display: flex; align-items: center; gap: 12px; background: #fff; border: 2px solid #E7E1D3;
      border-radius: 18px; padding: 14px; text-align: left; cursor: pointer; transition: border-color .2s;
    }
    .student-card:hover { border-color: var(--coral); }
    .avatar-circle {
      width: 44px; height: 44px; border-radius: 50%; background: var(--sky-light);
      display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2'; font-weight: 800; color: var(--coral);
    }
    .st-name { font-weight: 700; }
    .st-grade { font-size: 12px; color: var(--ink-soft); }

    .teacher-link { background: none; border: none; color: var(--ink-soft); font-weight: 700; cursor: pointer; text-decoration: underline; }

    .card-box { background: #fff; border: 2px solid #E7E1D3; border-radius: 24px; padding: 28px; width: 100%; max-width: 380px; text-align: center; }
    .pin-input {
      width: 100%; font-size: 28px; letter-spacing: 8px; text-align: center; padding: 10px;
      border: 2px solid #E7E1D3; border-radius: 14px; margin: 16px 0; outline: none;
    }
    .pin-input:focus { border-color: var(--coral); }

    .btn-primary {
      background: var(--coral); color: #fff; border: none; border-radius: 999px;
      padding: 10px 20px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 0 #C85A3B;
    }
    .btn-primary.big { width: 100%; padding: 14px; font-size: 16px; }
    .ghost-btn { background: none; border: none; color: var(--ink-soft); font-weight: 700; cursor: pointer; }
    .danger-btn { background: #E74C3C; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }

    .text-input { width: 100%; padding: 10px; border: 2px solid #E7E1D3; border-radius: 12px; outline: none; }
    .row-input { display: flex; gap: 8px; }

    .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    @media (max-width: 600px) { .dash-grid { grid-template-columns: 1fr; } }
    .dash-card { background: #fff; border: 2px solid #E7E1D3; border-radius: 18px; padding: 18px; }
    .form-stack { display: flex; flex-direction: column; gap: 10px; }

    .table-card { background: #fff; border: 2px solid #E7E1D3; border-radius: 18px; overflow: hidden; margin-top: 12px; }
    .dash-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    .dash-table th, .dash-table td { padding: 12px 14px; border-bottom: 1px solid #E7E1D3; }
    .dash-table th { background: #F8F6F0; font-weight: 700; }
    .td-bold { font-weight: 700; }

    .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .grade-badge { background: var(--sky-light); color: #2980B9; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 999px; }

    .word-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; }
    .word-card {
      background: #fff; border: 2px solid #E7E1D3; border-radius: 18px; padding: 16px; text-align: center;
      cursor: pointer; position: relative;
    }
    .word-card.mastered { border-color: var(--green); background: #F4FBF4; }
    .mastered-ribbon { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
    .word-emoji { font-size: 36px; }
    .word-name { font-weight: 700; margin: 6px 0 2px; }
    .stage-label { font-size: 11px; color: var(--ink-soft); }

    .activity-box { background: #fff; border: 2px solid #E7E1D3; border-radius: 24px; padding: 24px; text-align: center; }
    .quiz-card { margin: 16px 0; }
    .quiz-emoji { font-size: 56px; }
    .quiz-hint { color: var(--ink-soft); font-style: italic; }
    .sentence-card { font-size: 18px; background: var(--sky-light); padding: 14px; border-radius: 14px; margin: 14px 0; }
    .write-input { width: 100%; padding: 12px; border: 2px solid #E7E1D3; border-radius: 14px; font-size: 15px; margin: 12px 0; outline: none; }
    .err-msg { color: #E74C3C; font-size: 13px; font-weight: 700; }
    .success-msg { color: var(--green); font-size: 15px; font-weight: 700; margin-top: 12px; }
  `);
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(h(App));
</script>
</body>
</html>
